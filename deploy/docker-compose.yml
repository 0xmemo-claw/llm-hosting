services:
  # --- Haiku-class ---
  vllm_haiku:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    command: >
      --model Qwen/Qwen2.5-7B-Instruct
      --host 0.0.0.0
      --port 8001
      --dtype auto
      --max-model-len 8192
    ports:
      - "8001:8001"
    volumes:
      - ./models:/models

  # --- Sonnet-class ---
  vllm_sonnet:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=1
    command: >
      --model Qwen/Qwen2.5-32B-Instruct
      --host 0.0.0.0
      --port 8002
      --dtype auto
      --max-model-len 8192
    ports:
      - "8002:8002"
    volumes:
      - ./models:/models

  # --- Opus-class ---
  vllm_opus:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=2
    command: >
      --model Qwen/Qwen2.5-72B-Instruct
      --host 0.0.0.0
      --port 8003
      --dtype auto
      --max-model-len 8192
    ports:
      - "8003:8003"
    volumes:
      - ./models:/models

  # --- Router ---
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    environment:
      - LITELLM_LOG=INFO
      # no upstream API keys required; we route to local vLLM
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "8000", "--host", "0.0.0.0"]
    ports:
      - "8000:8000"
    depends_on:
      - vllm_haiku
      - vllm_sonnet
      - vllm_opus
