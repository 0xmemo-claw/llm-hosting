services:
  # MiniMax M2.5 AWQ — single H200 GPU
  # For Vast.ai bare-metal deployment, use the vllm serve command directly (see deploy.md).
  # This compose file is for environments with nvidia-docker available.
  vllm:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_USE_DEEP_GEMM=0
      - VLLM_USE_FLASHINFER_MOE_FP16=1
      - VLLM_USE_FLASHINFER_SAMPLER=0
    command: >
      --model QuantTrio/MiniMax-M2.5-AWQ
      --host 0.0.0.0
      --port 8000
      --max-model-len 65536
      --gpu-memory-utilization 0.98
      --tensor-parallel-size 1
      --enable-auto-tool-choice
      --tool-call-parser minimax_m2
      --reasoning-parser minimax_m2_append_think
      --trust-remote-code
      --enforce-eager
      --swap-space 16
      --cpu-offload-gb 50
      --max-num-seqs 4
    ports:
      - "8000:8000"
    volumes:
      - ./models:/workspace/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    environment:
      - LITELLM_LOG=INFO
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "8001", "--host", "0.0.0.0"]
    ports:
      - "8001:8001"
    depends_on:
      - vllm
