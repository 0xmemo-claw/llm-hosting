#   curl https://ada-sporting-marble-mike.trycloudflare.com/v1/chat/completions \
#     -H "Content-Type: application/json" \
#     -d '{"model":"QuantTrio/MiniMax-M2.5-AWQ","messages":[{"role":"user","content":"Hello"}],"max_tokens":500}'
