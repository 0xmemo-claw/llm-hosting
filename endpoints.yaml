# MiniMax M2.5 — Public Endpoints (via Cloudflare Tunnel)
# These URLs are generated by trycloudflare.com and may change on restart.

services:
  vllm:
    description: vLLM inference API (OpenAI-compatible)
    local: http://localhost:8000
    public: https://ada-sporting-marble-mike.trycloudflare.com
    paths:
      health: /health
      models: /v1/models
      chat: /v1/chat/completions
      completions: /v1/completions

  litellm:
    description: LiteLLM proxy (model aliasing — haiku/sonnet/opus)
    local: https://localhost:8080
    public: https://writer-annotation-management-modeling.trycloudflare.com
    paths:
      chat: /v1/chat/completions
      models: /v1/models
    aliases:
      - haiku
      - sonnet
      - opus

  ray:
    description: Ray dashboard (cluster monitoring)
    local: http://localhost:8265
    public: https://webshots-tomorrow-pension-dom.trycloudflare.com

  webui:
    description: Open WebUI
    local: http://localhost:1111
    public: https://portion-florida-explicit-conviction.trycloudflare.com

# Client config examples:
