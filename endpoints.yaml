# MiniMax M2.5 — API Endpoints
#
# The API is served through a custom Cloudflare Tunnel (not Vast.ai's built-in
# tunnels, which add cookie-based auth that breaks SDK clients). This tunnel
# points directly at LiteLLM, which handles API key auth via master_key.
#
# Tunnel URLs change on instance restart. Update the public URL below when
# restarting the tunnel. To get a stable URL, use a named Cloudflare Tunnel
# with a custom domain instead of trycloudflare.com.

api:
  description: LiteLLM proxy → vLLM (OpenAI-compatible, API key required)
  public: https://alumni-summaries-cart-nursing.trycloudflare.com
  api_key: ${M25_API_KEY}  # see .env
  models:
    - haiku
    - sonnet
    - opus
  paths:
    chat: /v1/chat/completions
    completions: /v1/completions
    models: /v1/models

internal:
  vllm:
    description: vLLM inference server (localhost only)
    url: http://localhost:8000
    model: QuantTrio/MiniMax-M2.5-AWQ
  litellm:
    description: LiteLLM proxy
    url: http://localhost:8001
  ray:
    description: Ray dashboard
    url: http://localhost:8265

# --- How to restart the tunnel after instance reboot ---
#
# ssh -p <PORT> root@<HOST> -i cred.pem
#
# nohup /opt/instance-tools/bin/cloudflared tunnel --url http://localhost:8001 \
#   > /var/log/cloudflared-litellm.log 2>&1 &
#
# grep 'trycloudflare.com' /var/log/cloudflared-litellm.log
#
# Update the public URL above with the new trycloudflare.com address.
